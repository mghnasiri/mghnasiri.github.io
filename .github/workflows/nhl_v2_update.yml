# .github/workflows/nhl_v2_update.yml
# Monte Carlo v2 Pipeline + Tim Hortons Scraper
# Telegram moved to nhl_meta_update.yml (Meta Ensemble, runs last at 15:15 UTC)

name: NHL Monte Carlo v2 Pipeline

on:
  schedule:
    # Daily at 2:00 PM UTC (9:00 AM Toronto)
    - cron: '0 14 * * *'
    # Early pass, only on matinee days (see scripts/matinee_gate.py)
    - cron: '7 9 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'predictions'
        type: choice
        options:
          - predictions
          - tims_only

# "Today" is the slate's Eastern date, also when a run slips past 00:00 UTC.
env:
  TZ: America/Toronto

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        working-directory: projects/nhl-hockey
        env:
          EARLY: ${{ github.event.schedule == '7 9 * * *' }}
        run: python3 scripts/matinee_gate.py

  predictions:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      needs.gate.outputs.run == 'true' && (
      github.event.schedule == '0 14 * * *' ||
      github.event.schedule == '7 9 * * *' ||
      github.event.inputs.action == 'predictions' ||
      github.event.inputs.action == 'tims_only')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy requests

      - name: Scrape Tim Hortons player pool
        working-directory: projects/nhl-hockey
        run: python scripts/fetch_tims_players.py
        continue-on-error: true

      - name: Run Monte Carlo predictions
        if: github.event.inputs.action != 'tims_only'
        working-directory: projects/nhl-hockey
        run: python scripts/monte_carlo_predict.py

      # Commit even when the model step failed, so the scraped Tims pool is
      # kept. The model scripts exit before writing latest.json on failure,
      # and the job still shows red.
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          DATESTAMP=$(date +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "MC v2 predictions for ${DATESTAMP}"
          pushed=0
          for i in 1 2 3; do
            git push origin main && { pushed=1; break; }
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && { pushed=1; break; }
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::Push failed after 3 attempts; today's output was not saved"; exit 1; }

      # Alert within minutes instead of waiting for the daily health check.
      - name: Alert on failure
        if: failure()
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/health_alert.py --workflow-failed
        continue-on-error: true

