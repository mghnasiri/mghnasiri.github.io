# .github/workflows/nhl_xg_v3_update.yml
# xG XGBoost v3 Pipeline — Shot data collection + ML predictions
# No untrusted inputs used in run: commands — only static strings and date

name: NHL xG v3 Pipeline

on:
  schedule:
    # Daily at 2:05 PM UTC (9:05 AM Toronto) — 5 min after MC v2
    - cron: '5 14 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'predictions'
        type: choice
        options:
          - predictions
          - backfill_14
          - backfill_season
          - backfill_multi_season
          - train_model
          - full_pipeline

jobs:
  predictions:
    runs-on: ubuntu-latest
    if: >-
      github.event.schedule == '5 14 * * *' ||
      github.event.inputs.action == 'predictions' ||
      github.event.inputs.action == 'full_pipeline'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install numpy pandas requests xgboost scikit-learn
          # CPU-only torch wheel so the Neural v2 inference step can load
          # the model; install size stays modest (~200MB) and no GPU runner
          # is needed for forward passes.
          pip install --index-url https://download.pytorch.org/whl/cpu torch

      - name: Pull latest (get MC v2 tims data if available)
        run: git pull --rebase origin main || git pull --no-rebase origin main

      - name: Scrape Tim Hortons player pool
        working-directory: projects/nhl-hockey
        run: python scripts/fetch_tims_players.py
        continue-on-error: true

      - name: Collect recent shot data (3-day self-healing window)
        working-directory: projects/nhl-hockey
        run: python scripts/collect_xg_data.py --backfill 3
        continue-on-error: true

      - name: Aggregate per-player real-shot distributions
        working-directory: projects/nhl-hockey
        run: python scripts/aggregate_player_shots.py
        continue-on-error: true

      - name: Run xG predictions
        working-directory: projects/nhl-hockey
        run: python scripts/xg_predict.py

      - name: Run xG predictions — synthetic-only shadow (Phase 4 A/B)
        working-directory: projects/nhl-hockey
        run: python scripts/xg_predict.py --synthetic-only
        continue-on-error: true

      - name: Run Lineup TOI v1 predictions (TOI-scaled xG)
        working-directory: projects/nhl-hockey
        run: python scripts/xg_predict.py --lineup-adjusted
        continue-on-error: true

      - name: Run Neural v1 predictions (MLP re-ranker on MC features)
        working-directory: projects/nhl-hockey
        run: python scripts/neural_predict.py
        continue-on-error: true

      - name: Run Neural v2 predictions (PyTorch MLP + player embeddings)
        working-directory: projects/nhl-hockey
        run: python scripts/neural_v2_predict.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          DATESTAMP=$(date +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "xG v3 predictions for ${DATESTAMP}"
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && break
            sleep 5
          done

  backfill_and_train:
    runs-on: ubuntu-latest
    # Long backfills (1-2 seasons) may need multiple hours of API calls.
    # ubuntu-latest default timeout is 360 min which covers a 2-season pull.
    timeout-minutes: 330
    if: >-
      github.event.inputs.action == 'backfill_14' ||
      github.event.inputs.action == 'backfill_season' ||
      github.event.inputs.action == 'backfill_multi_season' ||
      github.event.inputs.action == 'train_model' ||
      github.event.inputs.action == 'full_pipeline'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas requests xgboost scikit-learn

      - name: Backfill shot data (14 days)
        if: >-
          github.event.inputs.action == 'backfill_14' ||
          github.event.inputs.action == 'full_pipeline'
        working-directory: projects/nhl-hockey
        run: python scripts/collect_xg_data.py --backfill 14

      - name: Backfill shot data (1 season = 365 days)
        if: github.event.inputs.action == 'backfill_season'
        working-directory: projects/nhl-hockey
        run: python scripts/collect_xg_data.py --backfill 365

      - name: Backfill shot data (multi-season = 730 days)
        if: github.event.inputs.action == 'backfill_multi_season'
        working-directory: projects/nhl-hockey
        run: python scripts/collect_xg_data.py --backfill 730

      - name: Train xG model
        working-directory: projects/nhl-hockey
        run: python scripts/train_xg_model.py

      - name: Train Neural v1 model (MLP on prediction+results history)
        working-directory: projects/nhl-hockey
        run: python scripts/train_neural_model.py
        continue-on-error: true

      - name: Regenerate per-player shot aggregations
        if: >-
          github.event.inputs.action == 'backfill_season' ||
          github.event.inputs.action == 'backfill_multi_season'
        working-directory: projects/nhl-hockey
        run: python scripts/aggregate_player_shots.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "xG v3 data/model update"
          git push origin main || (git pull --rebase origin main && git push origin main)
