# .github/workflows/nhl_meta_update.yml
# Blend v1 (shadow) + the daily Telegram message. Runs LAST (15:20 UTC) after
# MC (14:00), xG (14:05), Direct LR (14:15), Market (14:30), Linear (15:00).
# Meta Ensemble used to run here; it was retired on 2026-10-12 (its
# within-group ranking was at chance), and the parameter-free blend took its
# slot. No untrusted inputs used in run: commands — only static strings and date

name: NHL Blend v1 + Telegram Pipeline

on:
  schedule:
    # Daily at 3:20 PM UTC (10:20 AM Toronto) — after all 4 base models + market
    - cron: '20 15 * * *'
    # Early pass, only on matinee days (see scripts/matinee_gate.py); sends an
    # early Telegram message before the first puck
    - cron: '27 10 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'predictions'
        type: choice
        options:
          - predictions

# "Today" is the slate's Eastern date, also when a run slips past 00:00 UTC.
env:
  TZ: America/Toronto

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        working-directory: projects/nhl-hockey
        env:
          EARLY: ${{ github.event.schedule == '27 10 * * *' }}
        run: python3 scripts/matinee_gate.py

  predictions:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: >-
      needs.gate.outputs.run == 'true' && (
      github.event.schedule == '20 15 * * *' ||
      github.event.schedule == '27 10 * * *' ||
      github.event.inputs.action == 'predictions')

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest (get the input models' predictions)
        run: git pull --rebase origin main || git pull --no-rebase origin main

      # A shadow model must never block the daily message.
      - name: Run Blend v1 (shadow)
        working-directory: projects/nhl-hockey
        run: python scripts/blend_predict.py
        continue-on-error: true

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          DATESTAMP=$(date +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "Blend predictions for ${DATESTAMP}"
          pushed=0
          for i in 1 2 3; do
            git push origin main && { pushed=1; break; }
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && { pushed=1; break; }
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::Push failed after 3 attempts; today's output was not saved"; exit 1; }

      # No continue-on-error: an unsent message (2026-10-03: "message is too
      # long") must fail the run so the alert below fires.
      - name: Send Telegram daily message
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py daily

      # Alert within minutes instead of waiting for the daily health check.
      - name: Alert on failure
        if: failure()
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/health_alert.py --workflow-failed
        continue-on-error: true
