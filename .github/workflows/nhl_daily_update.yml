# .github/workflows/nhl_daily_update.yml
# NN v1 Pipeline + Telegram Notifications (runs last at 15:00 UTC)
# Sends ONE daily message: yesterday's results + today's predictions
# All 3 models (MC v2 14:00, xG v3 14:05) are ready by 15:00

name: NHL Daily Predictions

on:
  schedule:
    - cron: '0 15 * * *'  # 10:00 AM Toronto
    - cron: '0 6 * * *'   # 01:00 AM Toronto
  
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'predictions'
        type: choice
        options:
          - predictions
          - results
          - both
          - telegram_daily
          - telegram_test

jobs:
  predictions:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 15 * * *' || github.event.inputs.action == 'predictions' || github.event.inputs.action == 'both'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Run predictions
        working-directory: projects/nhl-hockey
        run: python scripts/daily_predict.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "🏒 NN v1 predictions for $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && break
            sleep 5
          done

      - name: Pull latest (MC v2 + xG v3 data)
        run: git pull --rebase origin main || git pull --no-rebase origin main

      - name: Send Telegram daily message
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py daily
        continue-on-error: true

  results:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || github.event.inputs.action == 'results' || github.event.inputs.action == 'both'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas numpy requests
      
      - name: Fetch results
        working-directory: projects/nhl-hockey
        run: python scripts/fetch_results.py
      
      - name: Update dashboard
        working-directory: projects/nhl-hockey
        run: python scripts/update_dashboard.py
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Results for $(date -d 'yesterday' +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && break
            sleep 5
          done

  telegram_daily:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'telegram_daily'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send daily Telegram message
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py daily

  telegram_test:
    runs-on: ubuntu-latest
    if: github.event.inputs.action == 'telegram_test'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Send test notification
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_notify.py test
