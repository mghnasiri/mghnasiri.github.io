# .github/workflows/nhl_daily_update.yml
# Weighted Linear v1 Pipeline (runs at 15:00 UTC)
# Telegram moved to nhl_meta_update.yml (Meta Ensemble, runs last at 15:15 UTC)
# All 3 base models (MC v2 14:00, xG v3 14:05, Linear v1 15:00) feed Meta at 15:15

name: NHL Daily Predictions

on:
  schedule:
    - cron: '0 15 * * *'  # 10:00 AM Toronto
    - cron: '0 6 * * *'   # 01:00 AM Toronto
  
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'predictions'
        type: choice
        options:
          - predictions
          - results
          - both

jobs:
  predictions:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 15 * * *' || github.event.inputs.action == 'predictions' || github.event.inputs.action == 'both'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Pull latest (get MC v2 + xG v3 tims data)
        run: git pull --rebase origin main || git pull --no-rebase origin main

      - name: Scrape Tim Hortons player pool
        working-directory: projects/nhl-hockey
        run: python scripts/fetch_tims_players.py
        continue-on-error: true

      - name: Run predictions
        working-directory: projects/nhl-hockey
        run: python scripts/daily_predict.py

      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "Weighted Linear v1 predictions for $(date +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && break
            sleep 5
          done

  results:
    runs-on: ubuntu-latest
    if: github.event.schedule == '0 6 * * *' || github.event.inputs.action == 'results' || github.event.inputs.action == 'both'
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: pip install pandas numpy requests
      
      - name: Fetch results
        working-directory: projects/nhl-hockey
        run: python scripts/fetch_results.py
      
      - name: Update dashboard
        working-directory: projects/nhl-hockey
        run: python scripts/update_dashboard.py

      - name: Classify model status (champion / active / warning / deprecated)
        working-directory: projects/nhl-hockey
        run: python scripts/update_model_status.py
        continue-on-error: true
      
      - name: Commit and push
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          git diff --staged --quiet || git commit -m "📊 Results for $(date -d 'yesterday' +%Y-%m-%d)"
          for i in 1 2 3; do
            git push origin main && break
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && break
            sleep 5
          done

