# .github/workflows/nhl_direct_update.yml
# Direct LR v1: one logistic regression on every skater-game since 2021-22
# (scripts/direct_predict.py), refit each morning. Shadow model: graded and on
# the dashboard, not yet a Telegram pick source.
# No untrusted inputs used in run: commands — only static strings and date.

name: NHL Direct LR v1 Pipeline

on:
  schedule:
    # Daily at 14:15 UTC, after MC (14:00) and xG (14:05) have scraped the pool
    - cron: '15 14 * * *'
    # Early pass, only on matinee days (see scripts/matinee_gate.py)
    - cron: '17 9 * * *'

  workflow_dispatch:

# "Today" is the slate's Eastern date, also when a run slips past 00:00 UTC.
env:
  TZ: America/Toronto

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - uses: actions/checkout@v4
      - id: gate
        working-directory: projects/nhl-hockey
        env:
          EARLY: ${{ github.event.schedule == '17 9 * * *' }}
        run: python3 scripts/matinee_gate.py

  predictions:
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: needs.gate.outputs.run == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install numpy pandas scikit-learn requests

      - name: Pull latest (other workflows commit the Tims pool through the morning)
        run: git pull --rebase origin main || git pull --no-rebase origin main

      - name: Scrape Tim Hortons player pool
        working-directory: projects/nhl-hockey
        run: python scripts/fetch_tims_players.py
        continue-on-error: true

      # Completed seasons of per-game history never change; keep them between
      # runs instead of re-downloading (the current season is always fetched).
      - name: Restore per-game history cache
        uses: actions/cache@v4
        with:
          path: projects/nhl-hockey/data/cache/history
          key: nhl-history-v1-${{ github.run_id }}
          restore-keys: nhl-history-v1-

      - name: Run Direct LR predictions
        working-directory: projects/nhl-hockey
        run: python scripts/direct_predict.py

      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          DATESTAMP=$(date +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "Direct LR predictions for ${DATESTAMP}"
          pushed=0
          for i in 1 2 3; do
            git push origin main && { pushed=1; break; }
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && { pushed=1; break; }
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::Push failed after 3 attempts; today's output was not saved"; exit 1; }

      # Alert within minutes instead of waiting for the daily health check.
      - name: Alert on failure
        if: failure()
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/health_alert.py --workflow-failed
        continue-on-error: true
