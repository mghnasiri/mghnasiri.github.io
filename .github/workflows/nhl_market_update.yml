# .github/workflows/nhl_market_update.yml
# Market Odds v1 Pipeline — Fetches sportsbook anytime-goal-scorer odds
# Runs at 14:30 UTC (after MC v2 14:00, xG v3 14:05, before Linear 15:00)
# Needs base model predictions available for player ID matching
# No untrusted inputs used in run: commands — only static strings and date

name: NHL Market Odds v1 Pipeline

on:
  schedule:
    # Daily at 2:30 PM UTC (9:30 AM Toronto) — after MC/xG, before Linear
    - cron: '30 14 * * *'

  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run'
        required: true
        default: 'predictions'
        type: choice
        options:
          - predictions

# "Today" is the slate's Eastern date, also when a run slips past 00:00 UTC.
# (No matinee early pass for Market: a second daily Odds API call would
# exceed the monthly credit budget.)
env:
  TZ: America/Toronto

jobs:
  predictions:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Pull latest (get base model predictions for ID matching)
        run: git pull --rebase origin main || git pull --no-rebase origin main

      # Market is often the only model with picks (and Telegram's first
      # source), so it scrapes the pool itself instead of depending on MC/xG
      # having committed it. Runs after the pull so the tree is clean.
      - name: Scrape Tim Hortons player pool
        working-directory: projects/nhl-hockey
        run: python scripts/fetch_tims_players.py
        continue-on-error: true

      - name: Fetch market odds and generate predictions
        working-directory: projects/nhl-hockey
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API }}
        run: python scripts/market_predict.py

      # Commit even when Market failed, so the scraped Tims pool is kept;
      # market_predict exits 1 before writing latest.json.
      - name: Commit and push
        if: ${{ !cancelled() }}
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add -A
          DATESTAMP=$(date +%Y-%m-%d)
          git diff --staged --quiet || git commit -m "Market Odds predictions for ${DATESTAMP}"
          pushed=0
          for i in 1 2 3; do
            git push origin main && { pushed=1; break; }
            echo "Push attempt $i failed, pulling and retrying..."
            git pull --rebase -X theirs origin main || (git rebase --abort 2>/dev/null; git pull --no-rebase -X theirs origin main)
            git push origin main && { pushed=1; break; }
            sleep 5
          done
          [ "$pushed" = 1 ] || { echo "::error::Push failed after 3 attempts; today's output was not saved"; exit 1; }

      # Alert within minutes instead of waiting for the daily health check.
      - name: Alert on failure
        if: failure()
        working-directory: projects/nhl-hockey
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          WORKFLOW_NAME: ${{ github.workflow }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python scripts/health_alert.py --workflow-failed
        continue-on-error: true
